<!DOCTYPE html>
<!-- 2026-10-22 사용자 지시: 알파 전략 탭 — 예전 전략 전시(quant-house 전략 등록부 · CONTEST_MODE 로 숨김 · 그대로 둠)를
     wb UI 로 다시: 대상 = OF · CTA 델타 · UNI IRS v3.1 셋 · 블록 = 백테스트 · 기초 통계량 · 보유 포지션 · 오늘 진입 시그널.
     설명 글자는 전부 토글(설명 보기 · ? 툴팁) · 상태 칩(페이퍼 · deployed/proposed · tier · 판정)은 늘 보임.
     데이터 = 기존 읽기 전용 API 그대로(/quant-house/strategy · /backtest · /portfolio-forward — 새 라우트 없음) ·
     엔진·등록부 값 재계산 0. 로직 = /assets/js/wb-alpha.js. -->
<html lang="ko" data-contest="1" data-wb>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>/* wb 기본 테마 선적용(첫 페인트 깜빡임 방지) — 저장값 없으면 어두움 · wb-shell.js 와 같은 규칙 */try{var t=localStorage.getItem('wb-theme');document.documentElement.setAttribute('data-theme',t==='light'||t==='dark'?t:'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
  <title>알파 전략 · Bond Quant House</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%8F%9B%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/css/wb.css?v=20261022c">
  <script src="/assets/js/wb-shell.js?v=20261022c"></script>
  <style>
    /* ═══ 알파 전략 — 표현만(wb 토큰 · 카드 · 표) ═══ */
    .al-head { align-items: center; }
    .al-seg { margin-left: var(--wb-s3); }
    .al-seg > button { min-width: 64px; }
    .al-strat { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin: var(--wb-s2) 0 var(--wb-s3); }
    .al-strat-name { font-size: var(--wb-fs-title); line-height: var(--wb-lh-title); font-weight: 600; }
    .al-strat-id { font-size: var(--wb-fs-label); color: var(--wb-muted); }
    .al-chips { display: inline-flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
    .al-more { margin: 0 0 var(--wb-s3); }
    .al-more > summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; font-size: var(--wb-fs-label); color: var(--wb-muted); user-select: none; }
    .al-more > summary::-webkit-details-marker { display: none; }
    .al-more > summary::before { content: '▸'; font-size: 10px; }
    .al-more[open] > summary::before { content: '▾'; }
    .al-more > summary:hover { color: var(--wb-ink); }
    .al-more-body { margin-top: var(--wb-s2); padding: var(--wb-s3) var(--wb-s4); background: var(--wb-subtle); border: 1px solid var(--wb-rule); border-radius: var(--wb-r-card); }
    .al-more-body dl { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: 13px; line-height: 20px; }
    .al-more-body dt { color: var(--wb-muted); font-size: var(--wb-fs-label); }
    .al-more-body dd { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
    .al-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--wb-gap); align-items: stretch; }
    .al-grid + .al-grid { margin-top: var(--wb-gap); }
    .al-card { display: flex; flex-direction: column; min-width: 0; }
    .al-body { flex: 1; min-width: 0; padding: var(--wb-s2) var(--wb-s4) var(--wb-s3); }
    .al-chart { position: relative; height: 260px; }
    .al-chart--dd { height: 64px; margin-top: 2px; }
    .al-chart-cap { font-size: var(--wb-fs-label); color: var(--wb-muted); margin-top: 4px; }
    .al-kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .al-kpi { padding: 8px 10px; border: 1px solid var(--wb-rule); border-radius: var(--wb-r-ctl); background: var(--wb-surface); min-width: 0; }
    .al-kpi dt { display: flex; align-items: center; font-size: var(--wb-fs-label); color: var(--wb-muted); white-space: nowrap; }
    .al-kpi dd { margin: 2px 0 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 4px; }
    .al-kpi-v { font-size: 20px; line-height: 26px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .al-kpi-u { font-size: var(--wb-fs-label); color: var(--wb-muted); white-space: nowrap; }
    .al-kpi-s { width: 100%; font-size: 11px; line-height: 16px; color: var(--wb-faint, var(--wb-muted)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .al-tablewrap { overflow: auto; max-height: 420px; }
    .al-table td.lt, .al-table th.lt { text-align: left; }
    .al-table td { font-variant-numeric: tabular-nums; }
    .al-table .mono { font-family: var(--wb-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace); font-size: 12px; }
    .al-sub { display: block; font-size: 11px; line-height: 14px; color: var(--wb-muted); }
    .al-sigh { margin: var(--wb-s2) 0 4px; font-size: var(--wb-fs-label); color: var(--wb-muted); }
    .al-sigh:first-child { margin-top: 0; }
    .al-sigh b { color: var(--wb-ink); font-weight: 600; }
    .al-cnt { display: inline-block; min-width: 18px; margin-left: 4px; padding: 0 5px; border: 1px solid var(--wb-rule); border-radius: var(--wb-r-ctl); font-size: 11px; line-height: 16px; text-align: center; color: var(--wb-ink); font-variant-numeric: tabular-nums; }
    .al-sigsplit { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .al-half { flex: 1 1 0; min-height: 132px; display: flex; flex-direction: column; padding: var(--wb-s2) var(--wb-s4) var(--wb-s3); }
    .al-half + .al-half { border-top: 1px solid var(--wb-rule); }
    .al-half .al-tablewrap { flex: 1 1 auto; max-height: none; min-height: 0; }
    .al-half .al-empty { padding: var(--wb-s2) 0; }
    .al-err { padding: var(--wb-s3) var(--wb-s4); border: 1px solid var(--wb-rule); border-left: 2px solid var(--wb-warn); border-radius: var(--wb-r-ctl); background: var(--wb-subtle); font-size: 13px; }
    .al-err .wb-error { display: block; margin-bottom: 4px; }
    .al-skel { padding: var(--wb-s4); }
    .al-skel .wb-skel--line:nth-child(2) { width: 82%; } .al-skel .wb-skel--line:nth-child(3) { width: 64%; }
    .al-empty { padding: var(--wb-s4) 0; font-size: 13px; color: var(--wb-muted); }
    @media (max-width: 1080px) { .al-grid { grid-template-columns: minmax(0, 1fr); } }
    @media (max-width: 720px) {
      .al-seg { margin-left: 0; width: 100%; }
      .al-chart:not(.al-chart--dd) { height: 220px; }
      .al-more-body dl { grid-template-columns: minmax(0, 1fr); gap: 2px 0; }
      .al-more-body dd { margin-bottom: 6px; }
    }
  </style>
</head>
<body>
<header id="wb-shell" data-area="alpha" data-page="alpha"></header>

<main class="wb-main" id="alMain">
  <div class="wb-pagehead al-head">
    <h1>알파 전략</h1><button type="button" class="wb-help" data-help="운용 대상 알파 전략 셋(OF · CTA 델타 · UNI IRS v3.1). 전략마다 백테스트 · 기초 통계량 · 보유 포지션 · 오늘 진입 시그널. 숫자는 엔진 산출물(등록부 registry · 백테스트 artifact · forward)을 그대로 보여 줌 — 웹에서 다시 계산하지 않음. 전부 페이퍼 추적(실탄 아님) · 자동매매 없음 · 실행은 재량." aria-label="설명 보기"></button>
    <span class="wb-badge">관찰 전용</span>
    <div class="wb-seg al-seg" id="alSeg" role="tablist" aria-label="전략 선택"></div>
  </div>

  <div class="al-strat" id="alStrat"><span class="wb-skel wb-skel--fig"></span><span class="wb-skel"></span></div>
  <div id="alMore"></div>

  <div class="al-grid">
    <section class="wb-card al-card" id="alBt" aria-label="백테스트"><div class="al-skel"><span class="wb-skel wb-skel--line"></span><span class="wb-skel wb-skel--line"></span><span class="wb-skel wb-skel--line"></span></div></section>
    <section class="wb-card al-card" id="alSt" aria-label="기초 통계량"><div class="al-skel"><span class="wb-skel wb-skel--line"></span><span class="wb-skel wb-skel--line"></span><span class="wb-skel wb-skel--line"></span></div></section>
  </div>
  <div class="al-grid">
    <section class="wb-card al-card" id="alPos" aria-label="보유 포지션"><div class="al-skel"><span class="wb-skel wb-skel--line"></span><span class="wb-skel wb-skel--line"></span><span class="wb-skel wb-skel--line"></span></div></section>
    <section class="wb-card al-card" id="alSig" aria-label="오늘 시그널"><div class="al-skel"><span class="wb-skel wb-skel--line"></span><span class="wb-skel wb-skel--line"></span><span class="wb-skel wb-skel--line"></span></div></section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/wb-chart.js?v=20261022c"></script>
<script src="/assets/js/wb-alpha.js?v=20261022c"></script>
</body>
</html>
