  <script>/* wb 기본 테마 선적용(첫 페인트 깜빡임 방지) — 저장값 없으면 어두움 · wb-shell.js 와 같은 규칙 */try{var t=localStorage.getItem('wb-theme');document.documentElement.setAttribute('data-theme',t==='light'||t==='dark'?t:'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
  <title>장외 호가 · Bond Quant House</title>

  <link rel="stylesheet" href="/assets/css/wb.css?v=20261022c">
  <script src="/assets/js/wb-shell.js?v=20261110a"></script>
  <style>
    /* ═══ 장외 호가 — 표현만(wb 토큰 · 카드 · 표) · 사자 = 파랑(--wb-down) · 팔자 = 빨강(--wb-up) ═══ */
    .otc-head { align-items: center; }
    .otc-head-meta { margin-left: auto; font-size: var(--wb-fs-label); color: var(--wb-muted); }
    .otc-view[hidden] { display: none !important; }
    .otc-gate { max-width: 640px; margin: var(--wb-s6) auto; }
    .otc-gate .wb-btn { margin-top: var(--wb-s3); }
    .otc-fb .wb-field .wb-input { width: 140px; }
    .otc-fb .wb-field .wb-input.otc-w-lg { width: 200px; }
    .otc-fb input[type="date"].wb-input { width: 140px; }
    .otc-fb select.wb-input { width: 150px; background: var(--wb-bg); }
    .otc-fb select#tmMember { width: 210px; }
    .otc-fb .otc-btns { display: flex; align-items: flex-end; gap: 6px; }

    .otc-chart { position: relative; height: 380px; }
    .otc-chart--sm { height: 96px; }
    .otc-chart--md { height: 220px; }

    .otc-t tbody tr.is-team td:first-child { box-shadow: inset 2px 0 0 var(--wb-accent); }

    .otc-buy { color: var(--wb-down); }
    .otc-sell { color: var(--wb-up); }
    .otc-sub { display: block; font-size: 11px; line-height: 13px; color: var(--wb-muted); }
    .otc-tag { display: inline-flex; align-items: center; height: 16px; padding: 0 4px; margin-left: 4px; font-size: 10px; line-height: 14px; border: 1px solid var(--wb-rule-strong); border-radius: 3px; color: var(--wb-muted); vertical-align: 1px; }

    .otc-tag--done { color: var(--wb-open); border-color: color-mix(in srgb, var(--wb-open) 45%, transparent); }
    .otc-tag--rst { color: var(--wb-warn); border-color: color-mix(in srgb, var(--wb-warn) 45%, transparent); }

    /* 이벤트 축 타임라인 */
    .otc-ev-box { position: relative; }
    .otc-ev-box > canvas.otc-ev-ov { position: absolute; left: 0; top: 0; pointer-events: none; }
    .otc-ev-nav { height: 46px; margin-top: 8px; border: 1px solid var(--wb-rule); border-radius: var(--wb-r-ctl); overflow: hidden; }

    .otc-leg > span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }

    .otc-leg i.ln.dot { border-top-style: dotted; border-top-width: 2px; }
    .otc-leg i.ring { display: inline-block; width: 9px; height: 9px; border: 2px solid var(--wb-open); border-radius: 50%; vertical-align: -1px; }
    .otc-leg i.blk { display: inline-block; width: 14px; height: 9px; border-radius: 2px; background: color-mix(in srgb, var(--wb-legacy-purple) 45%, transparent); border-top: 1.5px solid var(--wb-legacy-purple); }
    .otc-outbtn { height: 22px; }
    .otc-map-inner { position: relative; width: max-content; }
    .otc-map-hl { position: absolute; pointer-events: none; background: color-mix(in srgb, var(--wb-ink) 9%, transparent); outline: 1px solid color-mix(in srgb, var(--wb-mark) 35%, transparent); }
    .otc-map-hl[hidden] { display: none; }
    .otc-map-lab > div.is-hl { background: var(--wb-subtle); color: var(--wb-ink); font-weight: 600; }
    .otc-tag--fix { color: var(--wb-series-4); border-color: color-mix(in srgb, var(--wb-series-4) 50%, transparent); }
    .otc-chip-fix { color: var(--wb-series-4); border-color: color-mix(in srgb, var(--wb-series-4) 45%, transparent); }
    .otc-share { display: inline-flex; width: 56px; height: 8px; border-radius: 2px; overflow: hidden; vertical-align: middle; background: var(--wb-up); }

    .otc-mix { display: inline-flex; width: 84px; height: 8px; border-radius: 2px; overflow: hidden; vertical-align: middle; background: var(--wb-subtle); }
    .otc-mix > i { display: block; height: 100%; }
    .otc-legend-row { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: var(--wb-fs-label); color: var(--wb-muted); padding: 4px 0; }

    .otc-kpis { padding: var(--wb-s3) var(--wb-s4); }

    .otc-kpis .wb-kpi { min-width: 110px; padding: 0 var(--wb-s4); }
    .otc-kpis .wb-kpi:first-child { padding-left: 0; }
    .otc-tabs { margin: 0 0 var(--wb-s3); }
    .otc-sec[hidden] { display: none !important; }
    .otc-toolbar { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 6px 12px; padding: var(--wb-s2) var(--wb-s4) 0; }
    .otc-toolbar .wb-input { width: 110px; }
    .otc-toolbar select.wb-input { background: var(--wb-surface); }
    .otc-more { display: block; margin: 6px auto 4px; }
    .otc-err { padding: var(--wb-s3) var(--wb-s4); border: 1px solid var(--wb-rule); border-left: 2px solid var(--wb-warn); border-radius: var(--wb-r-ctl); background: var(--wb-subtle); font-size: 13px; overflow-wrap: anywhere; }

    /* 종목×일 지도 */
    .otc-map { display: flex; min-width: 0; border-top: 1px solid var(--wb-rule); }
    .otc-map-lab { flex: none; width: 132px; border-right: 1px solid var(--wb-rule); }

    .otc-map-lab > div:hover { background: var(--wb-subtle); }
    .otc-map-lab > div.sep { box-shadow: inset 0 1px 0 var(--wb-rule-strong); }

    .otc-map-lab > div.hd:hover { background: none; }
    .otc-map-lab small { color: var(--wb-faint); margin-left: 4px; }
    .otc-map-canvas { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; }

    .otc-hov { position: fixed; z-index: 150; pointer-events: none; padding: 6px 10px; background: var(--wb-surface); border: 1px solid var(--wb-rule-strong); border-radius: var(--wb-r-ctl); font-size: 12px; line-height: 18px; white-space: nowrap; }

    /* ⑥ 포지션 추정 */
    .otc-lim { margin: 0; padding: var(--wb-s2) var(--wb-s4) var(--wb-s3) calc(var(--wb-s4) + 16px); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 28px; font-size: 12px; line-height: 18px; color: var(--wb-ink); }
    .otc-lim li { padding-left: 2px; }
    .otc-lim li::marker { color: var(--wb-warn); font-weight: 600; }
    .otc-kpis--sm .wb-kpi-val { font-size: 16px; line-height: 22px; }
    .otc-kpis--sm { padding-top: 0; border-top: 1px solid var(--wb-rule); margin-top: 0; }
    .otc-sw { display: inline-block; width: 10px; height: 3px; border-radius: 1px; margin-right: 5px; vertical-align: 3px; }

    .otc-sm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--wb-s3) var(--wb-s4); padding: var(--wb-s2) var(--wb-s4) var(--wb-s3); }
    .otc-sm-cell { min-width: 0; }

    .otc-chart--xs { height: 150px; }

    .otc-read { padding: var(--wb-s2) var(--wb-s4) var(--wb-s3); font-size: 12px; line-height: 18px; }

    .otc-t td.na { color: var(--wb-muted); text-align: center; }
    /* (0) 보드 — 종목 칸 + 차트 · 상세 서랍 */
    .otc-bo-live { display: inline-flex; align-items: center; gap: 8px; min-height: var(--wb-ctl); }
    .otc-bo-live .wb-chip { height: var(--wb-ctl); padding: 0 12px; font-size: 12px; }
    .otc-bo-stat { font-size: 12px; color: var(--wb-muted); font-variant-numeric: tabular-nums; }

    .otc-dot.ok { background: var(--wb-open); } .otc-dot.warn { background: var(--wb-warn); } .otc-dot.err { background: var(--wb-up); }

    .otc-rb { margin-bottom: 8px; }
    .otc-rb-mini { font-size: 13px; font-variant-numeric: tabular-nums; }

    .otc-rb-head .wb-card-meta { display: inline-flex; align-items: center; gap: 6px; }
    .otc-rb-top { display: grid; grid-template-columns: minmax(200px, 232px) minmax(200px, 232px) minmax(0, 1fr); }
    .otc-rb-big { min-width: 0; padding: 10px 16px 12px; border-right: 1px solid var(--wb-rule); }

    .otc-rb-dy { font-size: 10px; font-weight: 400; }
    .otc-rb-mini small { font-size: 11px; font-weight: 400; }
    /* 원인 종목(엔진 driver) = 노랑 강조 */
    .otc-rb-t tbody tr.is-driver td, .otc-rb-t tbody tr.is-driver td.day, .otc-rb-t tbody tr.is-driver:hover td { background: color-mix(in srgb, var(--wb-basket) 20%, var(--wb-surface)); }

    .otc-rb-key { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 16px 0; font-size: 12px; line-height: 18px; color: var(--wb-muted); }

    .otc-rb-stat { display: flex; flex-wrap: wrap; gap: 2px 18px; padding: 0 16px 10px; font-size: 11px; line-height: 17px; color: var(--wb-muted); }
    .otc-rb-stat[hidden] { display: none; }
    .otc-rb-stat b { color: var(--wb-ink); font-weight: 600; }

    .otc-bo-quick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0 0 8px; font-size: 12px; color: var(--wb-muted); }
    .otc-bo-qlab { display: inline-flex; align-items: center; margin-right: 4px; }
    .otc-bo-row.is-sel .otc-bo-cell { box-shadow: inset 3px 0 0 var(--wb-accent); }
    .otc-bo-head .otc-bo-ex b { font-weight: 600; }
    /* 패널 자신의 폭 기준 배치(JS rbLayout 이 클래스를 붙임): rb-below = 표를 큰 숫자 아래로 · rb-stack = 매도/매수 표 두 덩이 · rb-wrap = 칸 안 줄바꿈 */
    .otc-rb.rb-below .otc-rb-top { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .otc-rb.rb-below .otc-rb-legs { grid-column: 1 / -1; border-top: 1px solid var(--wb-rule); }

    .otc-rb.rb-stack .otc-rb-legs table + table { border-top: 1px solid var(--wb-rule-strong); }
    .otc-rb.rb-wrap .otc-rb-t td { white-space: normal; height: auto; padding-top: 5px; padding-bottom: 5px; }
    .otc-rb.rb-wrap .otc-rb-t td .otc-tag { margin-left: 0; }
    /* 만기순 금리 변동 띠(기간·갱신 옆 · 좁으면 다음 줄로 내려가 6칸이 한 줄에) */
    .otc-st { flex: 1 1 540px; min-width: 0; display: flex; align-items: stretch; gap: 6px; }
    .otc-st-cell { flex: 1 1 0; min-width: 0; padding: 3px 8px 4px; background: var(--wb-surface); border: 1px solid var(--wb-rule); border-radius: var(--wb-r-ctl); }
    .otc-st-cell.is-bk { border-color: color-mix(in srgb, var(--wb-basket) 60%, transparent); background: color-mix(in srgb, var(--wb-basket) 8%, var(--wb-surface)); }
    .otc-st-cell.is-fut { border-style: dashed; border-color: var(--wb-rule-strong); }
    .otc-st-lab { font-size: 11px; line-height: 15px; color: var(--wb-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .otc-st-lab b { color: var(--wb-ink); font-weight: 600; }
    .otc-st-val { font-size: 19px; line-height: 23px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .otc-st-val small { margin-left: 2px; font-size: 10px; font-weight: 400; color: var(--wb-muted); }
    .otc-st-sub { font-size: 11px; line-height: 14px; color: var(--wb-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .otc-st-help { flex: none; align-self: center; }
    .otc-bo-qrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin: 0 0 8px; }
    .otc-bo-qrow .otc-bo-quick { margin: 0; }
    .otc-bo-qrow > .otc-leg { margin-left: auto; }
    .otc-rb-t td:last-child, .otc-rb-t th:last-child { padding-right: 14px; }   /* 마지막 열 숫자가 경계에 닿지 않게 */
    .otc-bo-rows { display: flex; flex-direction: column; gap: 8px; }
    .otc-bo-row { display: grid; grid-template-columns: 196px minmax(0, 1fr); background: var(--wb-surface); border: 1px solid var(--wb-rule); border-radius: var(--wb-r-card); }
    .otc-bo-row.is-open { border-color: var(--wb-mark); }
    .otc-bo-cell { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 10px 12px; border-right: 1px solid var(--wb-rule); }
    .otc-bo-in { width: 100%; height: 30px; font-size: 16px; font-weight: 600; }
    .otc-bo-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-height: 20px; }
    .otc-bo-mid { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 6px; margin-top: auto; }
    .otc-bo-lab { font-size: 11px; color: var(--wb-muted); }
    .otc-bo-midv { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; }
    .otc-bo-bp { font-size: 12px; font-weight: 600; }
    .otc-bo-team { font-size: 12px; color: var(--wb-muted); min-height: 18px; }
    .otc-bo-team b { font-weight: 600; }
    .otc-bo-main { min-width: 0; padding: 4px 4px 4px 6px; cursor: pointer; }
    .otc-bo-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0 14px; min-height: 26px; padding: 2px 8px; border-radius: 4px; font-size: 12px; color: var(--wb-muted); transition: background-color .5s; }
    .otc-bo-head b { color: var(--wb-ink); font-weight: 600; }
    .otc-bo-head b.otc-buy { color: var(--wb-down); } .otc-bo-head b.otc-sell { color: var(--wb-up); }
    .otc-bo-head b.wb-up { color: var(--wb-up); } .otc-bo-head b.wb-down { color: var(--wb-down); }
    .otc-bo-head .otc-bo-al { font-size: 14px; }
    .otc-bo-head .otc-bo-t { margin-left: auto; font-variant-numeric: tabular-nums; }
    .otc-bo-head.is-flash { background: color-mix(in srgb, var(--wb-accent) 28%, transparent); transition: none; }
    .otc-bo-ph { height: 170px; display: grid; place-items: center; padding: 0 12px; font-size: 12px; color: var(--wb-muted); text-align: center; }
    .otc-drawer { position: fixed; z-index: 45; top: var(--wb-shell-h); right: 0; bottom: 0; width: min(980px, 58vw); display: flex; flex-direction: column; background: var(--wb-bg); border-left: 1px solid var(--wb-rule-strong); }
    .otc-drawer[hidden] { display: none; }
    .wb-main.is-dr { max-width: none; margin-left: 0; margin-right: 0; }   /* 서랍이 열려 있을 때: 왼쪽 끝(여백 24px)부터 씀 — 닫히면 원래 가운데 정렬·최대 폭 */
    .otc-dr-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--wb-rule); }
    .otc-dr-title { font-size: var(--wb-fs-title); line-height: var(--wb-lh-title); }
    .otc-dr-title b { font-weight: 600; margin-right: 4px; }
    .otc-dr-sub { margin-left: 8px; font-size: 12px; color: var(--wb-muted); }
    .otc-dr-legend { margin-left: auto; }
    .otc-pane { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }   /* 하나면 전체 높이 · 둘이면 반씩 */
    .otc-pane[hidden] { display: none; }
    .otc-drawer.is-two .otc-pane + .otc-pane { border-top: 2px solid var(--wb-rule-strong); }
    .otc-pane.is-flash .otc-dr-head { background: color-mix(in srgb, var(--wb-accent) 28%, transparent); }
    .otc-dr-fix { flex: none; padding: 8px 16px 4px; }                                  /* 요약 + 차트 = 항상 보임 */
    .otc-dr-body { flex: 1; min-height: 0; overflow: auto; padding: 4px 16px 16px; }     /* 스트림·랭킹 = 칸 안에서 스크롤 */
    .otc-scroll--pane { max-height: none; overflow: visible; }
    /* 2칸일 때: 차트 160~190px + 여백을 줄여 스트림 줄을 번다(글자 크기는 그대로) */
    .otc-drawer.is-two .otc-dr-head { padding-top: 3px; padding-bottom: 3px; gap: 2px 10px; }
    .otc-drawer.is-two .otc-dr-fix { padding: 3px 16px 0; }
    .otc-drawer.is-two .otc-dr-sum { margin-bottom: 0; line-height: 18px; }
    .otc-drawer.is-two .otc-dr-body { padding-top: 2px; }
    .otc-drawer.is-two .otc-dr-body .wb-card-head { min-height: 30px; padding-top: 0; padding-bottom: 0; }
    .otc-drawer.is-two .otc-ev-box + .otc-cap { margin: 0; }
    .otc-dr-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; margin-bottom: 6px; font-size: 12px; color: var(--wb-muted); }
    .otc-dr-sum b { color: var(--wb-ink); font-weight: 600; }
    .otc-dr-sum b.otc-buy { color: var(--wb-down); } .otc-dr-sum b.otc-sell { color: var(--wb-up); }
    .otc-dr-sum b.wb-up { color: var(--wb-up); } .otc-dr-sum b.wb-down { color: var(--wb-down); }
    .otc-dr-sum a { margin-left: auto; color: var(--wb-ink); }
    .otc-scroll--dr { max-height: 420px; }
    /* (0b) 종목 스프레드(사용자 2026-11-10 · 엔진 pair_live 그대로) */
    .otc-fb .wb-field .wb-input.otc-pr-in { width: 118px; font-weight: 600; }
    #prCard.is-stale { opacity: .45; transition: opacity .2s; }
    .otc-pr-top { display: flex; flex-wrap: wrap; align-items: stretch; border-bottom: 1px solid var(--wb-rule); }
    .otc-pr-bigs { flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--wb-rule); }
    .otc-pr-bigrow { display: flex; flex: 1; }
    .otc-pr-big { flex: none; min-width: 190px; padding: 8px 16px 10px; border-right: 1px solid var(--wb-rule); }
    .otc-pr-bigrow .otc-pr-big:last-child { border-right: 0; }
    .otc-pr-lab { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .otc-pr-sw { display: inline-block; flex: none; width: 14px; height: 3px; border-radius: 1px; }
    .otc-pr-val { margin-top: 2px; font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .otc-pr-val small { margin-left: 3px; font-size: 12px; font-weight: 400; letter-spacing: 0; color: var(--wb-muted); }
    .otc-pr-info { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 8px 16px 8px; font-size: 12px; line-height: 18px; color: var(--wb-muted); font-variant-numeric: tabular-nums; }
    .otc-pr-info b { color: var(--wb-ink); font-weight: 600; }
    .otc-pr-info b.otc-buy { color: var(--wb-down); } .otc-pr-info b.otc-sell { color: var(--wb-up); }
    .otc-pr-trio { display: flex; flex-wrap: wrap; gap: 6px 0; }
    .otc-pr-tb { flex: 1 1 170px; min-width: 0; padding: 0 16px 0 0; margin-right: 16px; border-right: 1px solid var(--wb-rule); }
    .otc-pr-tb:last-child { border-right: 0; margin-right: 0; }
    .otc-pr-tl { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--wb-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .otc-pr-tv { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; margin-top: 1px; font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em; color: var(--wb-ink); font-variant-numeric: tabular-nums; }
    .otc-pr-tv small { margin-left: 2px; font-size: 12px; font-weight: 400; letter-spacing: 0; color: var(--wb-muted); }
    .otc-pr-tc { font-size: 12px; font-weight: 400; letter-spacing: 0; color: var(--wb-muted); white-space: nowrap; }
    .otc-pr-tc b { font-weight: 600; color: var(--wb-ink); }
    .otc-pr-qline { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 18px; font-size: 12px; color: var(--wb-muted); }
    .otc-pr-lq { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 5px; min-width: 0; }
    .otc-pr-nk { font-size: 11px; color: var(--wb-muted); white-space: nowrap; }
    .otc-pr-q { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
    .otc-pr-q b { font-weight: 600; }
    .otc-pr-sl { color: var(--wb-faint); }
    .otc-pr-sd { display: inline-block; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--sd); }
    .otc-pr-sd.is-fb { background: repeating-linear-gradient(135deg, var(--sd) 0 1.5px, transparent 1.5px 3px); box-shadow: 0 0 0 1.2px var(--sd); }
    .otc-pr-ab { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 3px; background: var(--wb-subtle); border: 1px solid var(--wb-rule-strong); font-size: 11px; font-weight: 600; color: var(--wb-ink); }
    .otc-pr-al { font-size: 13px; color: var(--wb-ink); }
    .otc-pr-st { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; min-width: 0; }
    .otc-pr-stl { display: inline-flex; align-items: center; gap: 5px; color: var(--wb-ink); font-weight: 600; white-space: nowrap; }
    .otc-pr-prob { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--wb-warn); }
    .otc-pr-lgb { appearance: none; background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .otc-pr-lgb:hover, .otc-pr-lgb:focus-visible { color: var(--wb-ink); }
    .otc-pr-lgb[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
    .otc-pr-cutl { display: inline-block; width: 0; height: 12px; border-left: 2px dashed var(--wb-warn); margin: 0 3px; }
    .otc-pr-band { display: inline-block; width: 12px; height: 8px; border-radius: 1px; vertical-align: -1px; }
    .otc-pr-band.is-fb { background: repeating-linear-gradient(135deg, var(--wb-ink) 0 1.5px, transparent 1.5px 4px); border: 1px solid var(--wb-rule-strong); }
    #prChart .otc-cap { margin-top: 8px; }
    .otc-pr-valw { display: inline-flex; align-items: center; gap: 4px; }
    @media (max-width: 1180px) { .otc-grid, .otc-grid--55, .otc-grid--3 { grid-template-columns: minmax(0, 1fr); } }
    @media (max-width: 900px) {
      .otc-drawer { width: 100vw; }
      .otc-bo-row { grid-template-columns: minmax(0, 1fr); }
      .otc-bo-cell { flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--wb-rule); }
      .otc-bo-in { width: 120px; } .otc-bo-mid { margin-top: 0; }
    }
    @media (max-width: 720px) {
      .otc-chart { height: 300px; } .otc-chart--lg { height: 320px; }
      .otc-head-meta { margin-left: 0; width: 100%; }
      .otc-map-lab { width: 96px; }
    }
  </style>
</head>
<body>
<header id="wb-shell" data-area="otc" data-page="otc-board"></header>

<main class="wb-main" id="otcMain">
  <div class="wb-pagehead otc-head">
    <h1>장외 호가</h1><span class="wb-help" role="button" tabindex="0" aria-label="설명 보기"><template><p><b>장외 메신저 호가(kbond_quote) 관찰 도구.</b> 보드(5종목 동시 · 5초 갱신) · 종목 스프레드(종목−3선 / 종목−종목 · 3초 갱신) · 종목 분석 · 브로커 분석 · 팀 해부(장중 → 일봉).</p><p>숫자는 엔진(otcdesk) 산출 그대로 — 웹에서 다시 계산하지 않음.</p><p>호가 ≠ 체결 · 체결 = ㅎㅈ/확정/거래 표시만 · 액면은 적힌 것만 · 관찰 전용(추천 0).</p><p>복원 = 2025-06~11 등 kbond_quote 금리 빈 행을 원문+전일민평 정수부로 복원(검증 정확 일치 98.8%).<br>근거 = 검증 2.8만 행(금리 있는 행 지우고 복원 후 대조).<br>금리 출처(복원 · 교정) 설명 = 종목 분석의 복원 · 교정 건수 옆 ? (엔진 규칙 문장 그대로).</p><p>비공개: 데이터는 키(X-QH-KEY)가 있어야 보인다.</p></template></span>
    <span class="wb-badge">관찰 전용</span><span class="wb-badge wb-badge--warn">비공개 · 키</span>
    <span class="otc-head-meta" id="otcMeta"></span>
  </div>

  <!-- 키 없음 / 거부 — 데이터 0 -->
  <div class="wb-notice wb-notice--warn otc-gate" id="otcGate" hidden>
    <div id="otcGateMsg">이 화면은 키(X-QH-KEY)가 있어야 데이터가 보입니다.</div>
    <button type="button" class="wb-btn wb-btn--primary" id="otcKeyBtn">키 입력</button>
  </div>
  <div id="otcFatal" hidden></div>

  <!-- ══ (0) 보드 — 첫 화면 ══ -->
  <section class="otc-view" id="vBoard" data-view="board" hidden aria-label="보드">
    <div class="wb-filterbar otc-fb">
      <div class="wb-field"><span class="wb-label">기간</span><div class="wb-seg" id="boDays" role="group" aria-label="기간"></div></div>
      <div class="wb-field"><span class="wb-label">갱신</span><div class="otc-bo-live"><button type="button" class="wb-chip" id="boAuto" aria-pressed="true" title="5초마다 새 호가 확인 — 탭이 가려지면 멈추고 돌아오면 바로 한 번">5초 갱신</button><span class="otc-dot" id="boDot" aria-hidden="true"></span><span class="otc-bo-stat" id="boStat" role="status"></span></div></div>
      <div class="otc-btns"><button type="button" class="wb-btn" id="boDefault" title="종목 칸을 기본 세트로 되돌림">기본 세트</button></div>
      <div class="otc-st" id="boStrip" aria-label="만기순 금리 변동(전일 민평 대비 bp)"></div>
    </div>
    <section class="wb-card otc-rb" id="rbCard" aria-label="실시간 저평">
      <div class="wb-card-head otc-rb-head">
        <span class="wb-card-title" title="집행 가능한 값 · 지표물 = 장내 호가 · 비지표 = 장외 메신저 호가(사자선/팔자선) · 우리 조달">실시간 저평(3선)<span id="rbTitleHelp" title=""></span></span>
        <span class="otc-rb-mini" id="rbMini"></span>
        <span class="wb-card-meta" id="rbMeta"></span>
        <button type="button" class="wb-btn wb-btn--sm" id="rbFold" aria-expanded="true" aria-controls="rbBody">접기 ▴</button>
      </div>
      <div id="rbBody">
        <div class="otc-rb-why" id="rbWhy" hidden></div>
        <div class="otc-rb-key" id="rbKey">
          <span class="otc-rb-kbadge" id="rbKeyBadge" hidden></span>
          <span class="otc-rb-klab">3선 키인</span>
          <input class="wb-input" id="rbKeyIn" type="number" step="0.01" inputmode="decimal" autocomplete="off" disabled aria-label="3선 선물 가격 키인(Enter = 적용)">
          <button type="button" class="wb-btn wb-btn--sm" id="rbKeyApply" disabled>적용</button>
          <button type="button" class="wb-btn wb-btn--sm" id="rbKeyClear" disabled>해제</button>
          <span id="rbKeyNote"></span>
          <span class="otc-rb-kmsg" id="rbKeyMsg"></span>
        </div>
        <div class="otc-rb-top">
          <div class="otc-rb-big" id="rbSell"><div class="otc-rb-lab">매도차익 저평 U</div><div class="otc-rb-val wb-muted">–</div><div class="otc-rb-sub"><span class="wb-loading">불러오는 중…</span></div></div>
          <div class="otc-rb-big" id="rbBuy"><div class="otc-rb-lab">매수차익 저평 Ub</div><div class="otc-rb-val wb-muted">–</div></div>
          <div class="otc-rb-legs" id="rbLegs"></div>
        </div>
        <div class="otc-toolbar"><button type="button" class="wb-chip" id="rbLegsBtn" aria-pressed="false" title="바스켓 종목별 저평 선을 같이 그림(실선 = 매도 좌표 · 점선 = 매수 좌표)">종목별 저평 선</button><button type="button" class="wb-chip" id="rbRefBtn" aria-pressed="false" title="참고 선: 전부 장내 호가로 낸 U/Ub · 현재가 U">참고 선</button><span class="otc-cap" id="rbChartCap"></span></div>
        <div class="otc-card-body" id="rbChartBox"></div>
        <div class="otc-rb-sthead"><button type="button" class="otc-rb-stbtn" id="rbStatBtn" aria-expanded="false" aria-controls="rbStat" title="계약 · 조달 · 계산에 쓴 선물 · 엑셀 값 · 정본 대조 · 바스켓 기준 — 누르면 펼침/접힘">계산 입력 · 조달 · 검증 ▸</button><span class="otc-rb-stflag" id="rbStatFlag"></span></div>
        <div class="otc-rb-stat" id="rbStat" hidden></div>
      </div>
    </section>
    <div class="otc-bo-qrow"><div class="otc-bo-quick" id="boQuick"></div>
<span class="otc-leg">
        <span><i class="ln" style="border-color:var(--wb-down)"></i>사자선</span>
        <span><i class="ln" style="border-color:var(--wb-up)"></i>팔자선</span>
        <span><i class="ln dash" style="border-color:var(--wb-ink)"></i>미드</span>
        <span><i class="ln dot" style="border-color:var(--wb-muted)"></i>전일민평</span>
        <span><i class="ln thin" style="border-color:var(--wb-down)"></i><i class="ln thin" style="border-color:var(--wb-up)"></i>장내 매수·매도</span>
        <span><i class="ln thin" style="border-color:var(--wb-series-5)"></i>장내 현재가</span>
        <span><b class="otc-buy">▲</b><b class="otc-sell">▼</b>팀 호가</span>
        <span class="wb-help" role="button" tabindex="0" aria-label="설명 보기"><template><p><b>가로</b> = 호가 이벤트 순서(같은 간격 · 실시각 아님) — 이벤트 = 사자선·팔자선이 바뀐 호가와 팀 호가. 여러 날이면 세로선 = 날 경계.</p><p><b>사자선/팔자선</b> = 그 종목·그 날 모든 브로커의 마지막 사자/팔자 금리(계단) · 미드 = 둘 평균 · 이상치는 빠져 있음.</p><p><b>화살표</b> = 팀 호가만(▲ 사자 파랑 · ▼ 팔자 빨강 · 전부 속 채움 · 그 호가 금리 높이 · 선 위에 그림). 굵은 테두리 + 바깥 고리 = 체결 표시 · 작고 옅은 화살표 = 금리 없이 방향만(미드 높이) · 흐린 화살표 = 이상치(세로 범위 밖이면 툴팁에만).</p><p><b>장내</b>(가는 선) = 장내 매수호가(파랑) · 매도호가(빨강) · 현재가(노랑) — 오늘은 열려 있는 엑셀 실시간, 지난 날은 1분 종가(현재가만 · 지표 종목과 3선). 장내가 있으면 가로축은 장외 이벤트와 장내 틱을 합친 축. 3선 칸은 가격 축.</p><p>한 차트에서 시각을 가리키면 다른 차트에도 그 시각(그 이전 마지막 이벤트)에 십자선이 선다.</p><p>다른 브로커의 개별 호가는 차트를 누르면 열리는 상세에서 본다.</p><p>호가 ≠ 체결 · 체결 = ㅎㅈ/확정/거래 표시만 · 관찰 전용(추천 0).</p></template></span>
      </span>
    </div>
    <div class="otc-bo-rows" id="boRows"></div>
    <aside class="otc-drawer" id="boDrawer" hidden aria-label="종목 상세(위·아래 2칸)"></aside>
  </section>

  <!-- ══ (0b) 종목 스프레드 — 종목−3선 / 종목−종목 장중 금리 스프레드(사용자 2026-11-10 · /otc/pair = 엔진 pair_live 그대로 · 3초 갱신) ══ -->
  <section class="otc-view" id="vSpread" data-view="spread" hidden aria-label="종목 스프레드">
    <div class="wb-filterbar otc-fb">
      <label class="wb-field"><span class="wb-label">A 다리</span><input class="wb-input otc-pr-in" id="prA" list="otcPairLegs" autocomplete="off" spellcheck="false" placeholder="예: 26-3"></label>
      <div class="otc-btns"><button type="button" class="wb-btn wb-btn--icon" id="prSwap" title="A ↔ B 바꾸기(출처 모드도 함께)" aria-label="A 와 B 바꾸기">⇄</button></div>
      <label class="wb-field"><span class="wb-label">B 다리</span><input class="wb-input otc-pr-in" id="prB" list="otcPairLegs" autocomplete="off" spellcheck="false" placeholder="3선 또는 종목"></label>
      <div class="wb-field"><span class="wb-label">기간</span><div class="wb-seg" id="prDays" role="group" aria-label="기간"></div></div>
      <div class="wb-field"><span class="wb-label">값</span><div class="otc-pr-valw"><div class="wb-seg" id="prVal" role="group" aria-label="레벨 또는 전일 대비 변동"><button type="button" data-prval="lvl" title="레벨 = 호가 금리 그대로 · 스프레드 = A − B">레벨</button><button type="button" data-prval="chg" title="변동 = 각 다리 호가 금리 − 그날 전일 기준값(종목 = 전일 민평 · 선물 = 전일 선물 종가) · 엔진 *_chg 값">변동</button></div><span id="prValHelp"></span></div></div>
      <div class="wb-field"><span class="wb-label">A 출처</span><div class="wb-seg" id="prModeA" role="group" aria-label="A 다리 출처"></div></div>
      <div class="wb-field"><span class="wb-label">B 출처</span><div class="wb-seg" id="prModeB" role="group" aria-label="B 다리 출처"></div></div>
      <div class="wb-field"><span class="wb-label">가로축</span><div class="wb-seg" id="prAxis" role="group" aria-label="가로축"><button type="button" data-praxis="time" title="시각(장중 공백 그대로 · 여러 날 = 날마다 칸)">시각</button><button type="button" data-praxis="ev" title="이벤트(행 순번 · 같은 간격 · 실시각 아님)">이벤트</button></div></div>
      <div class="wb-field"><span class="wb-label">세로축</span><div class="wb-seg" id="prYfit" role="group" aria-label="세로축 범위"><button type="button" data-pryfit="fit" title="맞춤 = 행의 2~98% 범위(전체 폭이 그 3배를 넘을 때만) · 벗어난 행은 가장자리에 개수와 최고/최저 값">맞춤</button><button type="button" data-pryfit="all" title="전체 = 최소~최대(튀는 값 포함)">전체</button></div></div>
      <div class="wb-field"><span class="wb-label">갱신</span><div class="otc-bo-live"><button type="button" class="wb-chip" id="prAuto" aria-pressed="true" title="3초마다 새 행 확인 — 탭이 가려지면 멈추고 돌아오면 바로 한 번">3초 갱신</button><span class="otc-dot" id="prDot" aria-hidden="true"></span><span class="otc-bo-stat" id="prStat" role="status"></span></div></div>
    </div>
    <section class="wb-card" id="prCard">
      <div class="wb-card-head"><span class="wb-card-title" id="prTitle">종목 스프레드</span><span class="wb-card-meta" id="prLegend"></span></div>
      <div id="prHead"></div>
      <div class="otc-card-body"><div id="prChart"></div><div class="otc-foot" id="prLimits"></div></div>
    </section>
  </section>

  <!-- ══ (A) 종목 분석 ══ -->
  <section class="otc-view" id="vBond" data-view="bond" hidden aria-label="종목 분석">
    <div class="wb-filterbar otc-fb">
      <label class="wb-field"><span class="wb-label">종목</span><input class="wb-input" id="bdAlias" list="otcBonds" autocomplete="off" spellcheck="false" placeholder="예: 26-3"></label>
      <label class="wb-field"><span class="wb-label">날짜</span><input class="wb-input" type="date" id="bdDate"></label>
      <div class="otc-btns">
        <button type="button" class="wb-btn wb-btn--icon" id="bdPrev" title="전 영업일" aria-label="전 영업일">‹</button>
        <button type="button" class="wb-btn wb-btn--icon" id="bdNext" title="다음 영업일" aria-label="다음 영업일">›</button>
        <button type="button" class="wb-btn" id="bdLatest">최신</button>
        <button type="button" class="wb-btn wb-btn--primary" id="bdLoad">LOAD</button>
      </div>
      <div class="wb-filterbar-end"><div class="otc-sum" id="bdSum"></div></div>
    </div>
    <section class="wb-card">
      <div class="wb-card-head"><span class="wb-card-title" id="bdChartTitle">호가 타임라인</span><span class="wb-card-meta" id="bdLegend"></span></div>
      <div class="otc-card-body"><div id="bdEv"></div></div>
    </section>
    <div class="otc-grid otc-grid--55">
      <section class="wb-card" id="bdStream"></section>
      <section class="wb-card" id="bdRank"></section>
    </div>
  </section>

  <!-- ══ (B) 브로커 분석 ══ -->
  <section class="otc-view" id="vBroker" data-view="broker" hidden aria-label="브로커 분석">
    <div class="wb-filterbar otc-fb">
      <label class="wb-field"><span class="wb-label">브로커 · 팀</span><input class="wb-input otc-w-lg" id="brName" list="otcBrokers" autocomplete="off" spellcheck="false" placeholder="이름 또는 팀"></label>
      <label class="wb-field"><span class="wb-label">기준일</span><input class="wb-input" type="date" id="brAsof"></label>
      <label class="wb-field"><span class="wb-label">기간</span><select class="wb-input" id="brPeriod"></select></label>
      <div class="otc-btns">
        <button type="button" class="wb-btn" id="brLatest">최신</button>
        <button type="button" class="wb-btn wb-btn--primary" id="brLoad">LOAD</button>
      </div>
      <div class="wb-filterbar-end"><div class="otc-sum" id="brSum"></div></div>
    </div>
    <section class="wb-card" id="brKpi"></section>
    <div class="otc-grid">
      <section class="wb-card"><div class="wb-card-head"><span class="wb-card-title">일별 메시지</span><span class="wb-card-meta" id="brDailyMeta"></span></div><div class="otc-card-body"><div class="otc-chart otc-chart--md"><canvas id="brDaily"></canvas></div></div></section>
      <section class="wb-card"><div class="wb-card-head"><span class="wb-card-title">시간대 분포</span><span class="wb-card-meta">메시지 · 시(時)</span></div><div class="otc-card-body"><div class="otc-chart otc-chart--md"><canvas id="brHourly"></canvas></div></div></section>
    </div>
    <div class="otc-grid otc-grid--55">
      <section class="wb-card" id="brCover"></section>
      <section class="wb-card" id="brRecent"></section>
    </div>
  </section>

  <!-- ══ (C) 팀 해부 ══ -->
  <section class="otc-view" id="vTeam" data-view="team" hidden aria-label="팀 해부">
    <div class="wb-filterbar otc-fb">
      <label class="wb-field"><span class="wb-label">멤버</span><select class="wb-input" id="tmMember"></select></label>
      <div class="wb-field"><span class="wb-label">기간</span><div class="wb-seg" id="tmPeriod" role="group" aria-label="기간 프리셋"></div></div>
      <label class="wb-field"><span class="wb-label">시작(선택)</span><input class="wb-input" type="date" id="tmStart"></label>
      <label class="wb-field"><span class="wb-label">끝(기준일)</span><input class="wb-input" type="date" id="tmEnd"></label>
      <div class="otc-btns"><button type="button" class="wb-btn wb-btn--primary" id="tmLoad">LOAD</button></div>
      <div class="wb-filterbar-end"><div class="otc-sum" id="tmSum"></div></div>
    </div>
    <div class="wb-seg otc-tabs" id="tmTabs" role="tablist" aria-label="팀 해부 화면">
      <button type="button" data-sec="sum">1 기간 요약</button>
      <button type="button" data-sec="map">2 종목×일 지도</button>
      <button type="button" data-sec="intra">3 장중 행태</button>
      <button type="button" data-sec="bond">4 종목 시계열</button>
      <button type="button" data-sec="daily">5 일봉</button>
      <button type="button" data-sec="pos">6 포지션 추정</button>
    </div>
    <div class="otc-sec" id="tmSecSum" data-sec="sum" hidden></div>
    <div class="otc-sec" id="tmSecMap" data-sec="map" hidden></div>
    <div class="otc-sec" id="tmSecIntra" data-sec="intra" hidden></div>
    <div class="otc-sec" id="tmSecBond" data-sec="bond" hidden></div>
    <div class="otc-sec" id="tmSecDaily" data-sec="daily" hidden></div>
    <div class="otc-sec" id="tmSecPos" data-sec="pos" hidden></div>
  </section>

  <datalist id="otcBonds"></datalist>
  <datalist id="otcBrokers"></datalist>
  <datalist id="otcPairLegs"></datalist>
  <div class="otc-hov" id="otcHov" hidden></div>
</main>
